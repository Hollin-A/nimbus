# Security headers shared across all served paths. Repeated via `include`
# inside every location block that uses its own `add_header` for
# Cache-Control — nginx's add_header inheritance is "block-or-parent,
# never both", so a location's own add_header silently drops the
# server-level ones. CSP itself is deferred to a later commit (needs
# the resource inventory + a report-only rollout to avoid breakage).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
