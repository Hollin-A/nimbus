server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. nginx serves the static SPA;
    # the backend's helmet middleware only covers backend responses, so
    # without this the SPA shell ships with zero hardening. `always`
    # ensures the headers are sent on error responses too (4xx/5xx),
    # not only on 2xx — that matters for an attacker probing 404s.
    # CSP itself is deferred to a later commit (needs the resource
    # inventory + a report-only rollout to avoid breakage).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # SPA fallback — every unknown path renders the app shell so the
    # client-side router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA control plane — these MUST revalidate so a new deploy
    # actually replaces the running service worker on the next visit.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Gzip text-y responses on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
