# Local one-shot demo: `docker compose up --build` brings the API and the
# frontend up together. NOT the production deployment — Render + Vercel
# build the same Dockerfiles individually (see docs/ARCHITECTURE.md).
#
# Before first run: `cp .env.example .env` and set JWT_SECRET. Compose
# will refuse to start otherwise — better than shipping a placeholder.

services:
  backend:
    build:
      context: ./backend
    environment:
      - NODE_ENV=production
      # Fail loud if missing — no placeholder default. Copy .env.example
      # to .env and set a real value before booting.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set a real value}
      - JWT_EXPIRES_IN=2h
      - CORS_ORIGIN=http://localhost:8080
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
        - VITE_SOCKET_URL=http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      # Wait for the backend to actually be ready (healthcheck green),
      # not just for its process to exist.
      backend:
        condition: service_healthy
    restart: unless-stopped
