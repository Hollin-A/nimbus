# Local one-shot demo: `docker compose up --build` brings the API and the
# frontend up together. NOT the production deployment — Render + Vercel
# build the same Dockerfiles individually (see docs/ARCHITECTURE.md).
#
# Before first run: `cp .env.example .env` and set JWT_SECRET. Compose
# will refuse to start otherwise — better than shipping a placeholder.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=nimbus
      # Same fail-loud pattern as JWT_SECRET — no placeholder default.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a real value}
      - POSTGRES_DB=nimbus
    ports:
      # Published to the host: local `npm run dev` and `prisma migrate`
      # run outside the compose network and connect via localhost.
      - "5432:5432"
    volumes:
      # Named volume so data survives container recreation.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      - NODE_ENV=production
      # Fail loud if missing — no placeholder default. Copy .env.example
      # to .env and set a real value before booting.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set a real value}
      - JWT_EXPIRES_IN=15m
      - CORS_ORIGIN=http://localhost:8080
      - DATABASE_URL=postgresql://nimbus:${POSTGRES_PASSWORD}@postgres:5432/nimbus
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
        - VITE_SOCKET_URL=http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      # Wait for the backend to actually be ready (healthcheck green),
      # not just for its process to exist.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
